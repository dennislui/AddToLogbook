<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Logbook"/>
<title>Surgical Logbook</title>
<link rel="apple-touch-icon" href="icon.png"/>
<style>
*, *::before, *::after { box-sizing: border-box; }

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }

input, select, textarea {
  width: 100%; padding: 8px 10px; font-size: 14px;
  border-radius: 8px; border: 1px solid #d1d5db;
  background: #fff; color: #1a1a1a; font-family: inherit;
  outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
textarea { resize: vertical; }

.tab.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; font-weight: 600; }
.suggest-item:hover, .suggest-item.active { background: #eff6ff; color: #2563eb; }
.status       { font-size: 13px; color: #16a34a; margin-left: 8px; }
.status.error { color: #dc2626; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.suggest {
  position: absolute; top: 100%; left: 0; right: 0;
  background: #fff; border: 1px solid #d1d5db; border-radius: 10px;
  z-index: 100; max-height: 220px; overflow-y: auto; margin-top: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid #e5e7eb; border-top-color: #2563eb;
  border-radius: 50%; animation: spin 0.6s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg) } }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { corePlugins: { preflight: false } }
</script>
</head>
<body>
<div class="max-w-2xl mx-auto px-4 py-6">
  <div class="flex items-baseline justify-between mb-6">
    <h1 class="text-xl font-semibold tracking-tight text-gray-900">Surgical logbook</h1>
    <span id="userInfo" class="text-[13px] text-gray-400"></span>
  </div>

  <div id="signinView" class="py-12 px-4 text-center">
    <h2 class="text-lg font-medium mb-3">Sign in to continue</h2>
    <p class="text-sm text-gray-500 max-w-[300px] mx-auto mb-6 leading-relaxed">Your cases sync to Google Sheets and are available on any device.</p>
    <button class="px-7 py-3 text-base font-medium rounded-lg bg-blue-600 text-white border-0 cursor-pointer hover:bg-blue-700 transition-colors min-h-[44px]" onclick="startSignIn()">Sign in with Google</button>
    <p id="signinError" style="color:#dc2626;font-size:13px;margin-top:8px"></p>
  </div>

  <div id="mainView" style="display:none">
    <div class="flex gap-2 mb-6">
      <button class="tab active flex-1 text-center px-4 py-2.5 text-sm rounded-lg border border-gray-300 bg-transparent cursor-pointer text-gray-800 min-h-[44px] transition-colors" onclick="switchTab('entry')" id="tab-entry">New case</button>
      <button class="tab flex-1 text-center px-4 py-2.5 text-sm rounded-lg border border-gray-300 bg-transparent cursor-pointer text-gray-800 min-h-[44px] transition-colors" onclick="switchTab('log')" id="tab-log">Log</button>
    </div>

    <div id="view-entry">
      <div class="bg-white border border-gray-200 rounded-xl p-5 mb-3 shadow-md">
        <div id="editBanner" style="display:none" class="text-sm text-blue-700 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 mb-3">Editing existing case</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div><label class="block text-[13px] text-gray-500 mb-1">Patient number</label><input id="f-PtNumber" placeholder="e.g. 001"/></div>
          <div><label class="block text-[13px] text-gray-500 mb-1">Age (years)</label><input id="f-AgeYears" type="number" placeholder="e.g. 65"/></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div><label class="block text-[13px] text-gray-500 mb-1">Date of operation</label><input id="f-DateOfOperation" type="date"/></div>
          <div><label class="block text-[13px] text-gray-500 mb-1">CEPOD</label><select id="f-CEPOD"><option>Elective</option><option>Urgent</option><option>Emergency</option><option>Immediate</option></select></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div><label class="block text-[13px] text-gray-500 mb-1">ASA grade</label><select id="f-ASA"><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option></select></div>
          <div><label class="block text-[13px] text-gray-500 mb-1">Supervision</label><select id="f-Supervision"><option>Surgeon</option><option>Supervised</option><option>Assisted</option><option>Observed</option></select></div>
        </div>
        <div class="mb-3"><label class="block text-[13px] text-gray-500 mb-1">Responsible consultant</label><input id="f-ResponsibleConsultant" placeholder="Surname"/></div>
        <div class="mb-3" style="position:relative">
          <label class="block text-[13px] text-gray-500 mb-1">Operation <span style="color:#dc2626">*</span></label>
          <input id="f-Operation" autocomplete="off" placeholder="Type to search procedures..."
            oninput="onOpInput(this.value)"
            onkeydown="onOpKey(event)"
            onblur="setTimeout(hideSug,150)"/>
          <div class="suggest" id="suggestions" style="display:none"></div>
        </div>
        <div class="mb-3"><label class="block text-[13px] text-gray-500 mb-1">Hospital</label><input id="f-Hospital" placeholder="e.g. St Thomas'"/></div>
        <div class="mb-3">
          <label class="block text-[13px] text-gray-500 mb-1">Operation notes</label>
          <textarea id="f-OperationNotes" rows="3" placeholder="Findings, complications, outcome..."></textarea>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button class="px-5 py-2.5 text-sm font-medium rounded-lg bg-blue-600 text-white border-0 cursor-pointer min-h-[44px] hover:bg-blue-700 transition-colors" onclick="saveCase()" id="saveBtn">Save case</button>
          <button class="px-5 py-2.5 text-sm font-medium rounded-lg border border-gray-300 bg-gray-100 text-gray-800 cursor-pointer min-h-[44px] hover:bg-gray-200 transition-colors" onclick="cancelEdit()" id="cancelBtn" style="display:none">Cancel</button>
          <span id="saveStatus" class="status"></span>
        </div>
      </div>
    </div>

    <div id="view-log" style="display:none">
      <div class="flex flex-wrap gap-2 mb-3">
        <input class="flex-1 min-w-[180px]" placeholder="Search cases..." oninput="renderLog(this.value)"/>
        <button class="px-5 py-2.5 text-sm font-medium rounded-lg border border-gray-300 bg-gray-100 text-gray-800 cursor-pointer min-h-[44px] hover:bg-gray-200 transition-colors" onclick="exportCSV()">Export CSV</button>
      </div>
      <div id="lastSync" class="text-xs text-gray-400 mb-3"></div>
      <div id="logList"></div>
    </div>
  </div>
</div>

<script>
const SHEET_ID = "1WyspYrH5nr1J65ZSqqiRF2TLvcnlLfLq9mojWSGgHgM";
const SHEET_NAME = "Sheet1";
const CLIENT_ID = "510995347454-4hjfoptvsf36asgfqipq779lvop92296.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email";
const REDIRECT_URI = "https://dennislui.github.io/AddToLogbook/";
const COLS = ["PtNumber","AgeYears","DateOfOperation","CEPOD","ASA","ResponsibleConsultant","Supervision","Operation","Hospital","OperationNotes"];
const PROCEDURES = ["AV fistula, PTFE loop graft groin","AV fistula, PTFE straight graft arm","AV fistula, basilic vein transposition","AV fistula, brachiocephalic","AV fistula, radiocephalic","Above knee","Aortic Stent","Aortic endarterectomy","Aortobi-iliac bypass","Aortobifemoral graft","Aortoiliac aneurysm +/- int iliac embolisation","Aortounifemoral bypass","Application of negative pressure dressing","Arm fasciotomies","Arterial embolistaion","Arterial line insertion","Arterial thrombolysis","Arterial thrombolysis and angioplasty / stent","Axillofem/bifemoral bypass","Banding of AV fistula","Below knee - Burgess flap","Below knee - skew flap","Biopsy of leg ulcer","Brachial embolectomy","Branched stent graft","Carotid - Carotid bypass","Carotid - subclavian bypass","Carotid endartarectomy - no patch","Carotid endartarectomy and Patch","Carotid interposition graft","Change of negative pressure dressing","Conduit for endovascular access","Crural artery angioplasty","Crural artery stent","Deep venous reconstruction - IVC","Deep venous reconstruction - iliac","Deep venous stenting - iliac","Diagnostic Femoral angiogram","Diagnostic Laparotomy","EVAR planning","Embolisation of other visceral artery","Exploration of arm wound +/- vessels","Fem-Fem bypass (ipsilateral and crossover)","Fem-Fem bypass / interposition graft / Repair","Femoral artery angioplasty","Femoral artery endartarectomy +/- Patch","Femoral artery stent","Femoral embolectomy","Femoro - Above knee popliteal - Prosthetic","Femoro - Above knee popliteal - Vein","Femoro - Below knee popliteal - Vein","Femoro - Crural - Prosthetic","Femoro - Crural - Vein","Fenestrated stent graft","First rib excision - Supraclavicular","Fistula/graft thrombectomy","Foam sclerotherapy, GSV truncal","Foam sclerotherapy, SSV truncal","Foam sclerotherapy, varicosities","Full thickness skin graft","GSV truncal ablation","GSV truncal ablation + foam sclerotherapy","GSV truncal ablation + phlebectomies","General Surgery","Gritti-stokes","IVC filter - insertion","IVC filter - removal","Iliac Angioplasty","Iliac Artery Stent","Iliac Endarterectomy +/- patch closure","Iliofemoral bypass","Infrarenal bifurcated - femoral","Infrarenal bifurcated - iliac","Infrarenal tube graft","Insertion of ambulatory peritoneal dialysis catheter","Insertion of non tunnelled central venous catheter","Internal iliac embolisation","Juxta/pararenal, inter or suprarenal clamp","Kissing Iliac Artery stents","Laparotomy and adhesiolysis/ Division of band adhesion","Ligation of artery","Ligation of fistula","Ligation of vein","Lower limb - 4 compartment fasciotomies","Lower limb arterial embolisation (not femoral)","Major debridement eg nec fasc/ gangrene","Minor debridement (non diabetic foot) eg wound edges","Multiple phlebectomies","Open Surgical Nephrectomy","Other","Other fasciotomies","Other venous embolisation","Percutaneous clot aspiration","Pharmaco-mechanical venous thrombolysis","Popliteal aneurysm repair- posterior approach/ interposition graft","Popliteal artery angioplasty","Popliteal artery stent","Popliteal embolectomy","Profundaplasty","Removal of Hickman line/ tunneled central venous catheter","Removal of ambulatory peritoneal dialysis catheter","Removal of carotid body tumour","Removal of central vein catheter","Removal of infected interposition graft","Removal of portacath","Renal allotransplant","Renal autotransplant","Repair of artery - Trauma, not subclavian","Repair of carotid aneurysm","Repair of visceral artery aneurysm","Revision of fistula (incl bleeding, aneurysm, occlusive disease)","Revision Of Previous Amputation (Amputation-Lower Limb)","SSV truncal ablation","SSV truncal ablation + foam sclerotherapy","Sartorius muscle flap","Split Skin Graft","St Mary's boot","Standard infrarenal EVAR","Stent of other visceral artery","Temporal artery biopsy","Thigh fasciotomies","Thoracic stent graft","Thoracoabdominal, supracoeliac clamp","Through knee","Toe - great","Toe(s), other","Transmetatarsal","Trauma Laparotomy + Damage Control","Venogram","Visceral aspiration/mechanical thrombo-embolectomy","Work bench preparation of kidney","ligation bleeding vessel"];

let accessToken = null;
let allEntries = [];
let editRowIndex = null;
let lastExportTime = localStorage.getItem("logbook_last_export") || null;
let sugFiltered = [];
let activeIdx = -1;

function startSignIn() {
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem("oauth_state", state);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "token",
    scope: SCOPE,
    state: state,
    include_granted_scopes: "true"
  });
  window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
}

function handleRedirectToken() {
  const hash = window.location.hash.substring(1);
  if (!hash) return false;
  const params = new URLSearchParams(hash);
  const token = params.get("access_token");
  if (!token) return false;
  accessToken = token;
  history.replaceState(null, "", REDIRECT_URI);
  return true;
}

async function init() {
  const authed = handleRedirectToken();
  if (authed) {
    try {
      const profile = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
        headers: {"Authorization":"Bearer " + accessToken}
      }).then(r => r.json());
      document.getElementById("userInfo").textContent = profile.email || "";
    } catch(e) {}
    document.getElementById("signinView").style.display = "none";
    document.getElementById("mainView").style.display = "block";
    setTodayDate();
    await loadEntries();
  }
}

window.addEventListener("load", init);

function setTodayDate() {
  document.getElementById("f-DateOfOperation").value = new Date().toISOString().slice(0,10);
}

async function apiRequest(method, path, body) {
  const base = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID;
  const res = await fetch(base + path, {
    method,
    headers: {"Authorization":"Bearer " + accessToken, "Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json();
}

async function loadEntries() {
  const data = await apiRequest("GET", "/values/" + SHEET_NAME);
  const rows = data.values || [];
  allEntries = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const entry = {};
    COLS.forEach((c, j) => entry[c] = row[j] || "");
    entry._row = i + 1;
    allEntries.push(entry);
  }
  if (rows.length === 0) {
    await apiRequest("PUT", "/values/" + SHEET_NAME + "!A1?valueInputOption=RAW", {values:[COLS]});
  }
  updateLogCount();
  renderLog("");
  const el = document.getElementById("lastSync");
  if (el) el.textContent = "Last synced: " + new Date().toLocaleTimeString("en-GB");
}

function updateLogCount() {
  document.getElementById("tab-log").textContent = "Log (" + allEntries.length + ")";
}

async function saveCase() {
  const op = document.getElementById("f-Operation").value.trim();
  const date = document.getElementById("f-DateOfOperation").value;
  if (!op || !date) { setStatus("saveStatus","Operation and date required","error"); return; }
  const row = COLS.map(c => { const el = document.getElementById("f-"+c); return el ? el.value.trim() : ""; });
  setStatus("saveStatus","<span class='spinner'></span>Saving...");
  document.getElementById("saveBtn").disabled = true;
  if (editRowIndex !== null) {
    await apiRequest("PUT", "/values/" + SHEET_NAME + "!A" + editRowIndex + "?valueInputOption=RAW", {values:[row]});
    setStatus("saveStatus","Updated");
    cancelEdit();
  } else {
    await apiRequest("POST", "/values/" + SHEET_NAME + "!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS", {values:[row]});
    setStatus("saveStatus","Saved");
    clearForm();
  }
  document.getElementById("saveBtn").disabled = false;
  await loadEntries();
  setTimeout(() => setStatus("saveStatus",""), 2500);
}

function clearForm() {
  COLS.forEach(c => {
    const el = document.getElementById("f-"+c);
    if (!el) return;
    if (el.tagName === "SELECT") {
      if (c==="CEPOD") el.value="Elective";
      else if (c==="ASA") el.value="II";
      else if (c==="Supervision") el.value="Assisted";
    } else if (c==="DateOfOperation") {
      el.value = new Date().toISOString().slice(0,10);
    } else { el.value = ""; }
  });
}

function editEntry(rowJson) {
  const entry = JSON.parse(rowJson);
  COLS.forEach(c => { const el = document.getElementById("f-"+c); if (el) el.value = entry[c] || ""; });
  editRowIndex = entry._row;
  document.getElementById("editBanner").style.display = "block";
  document.getElementById("saveBtn").textContent = "Update case";
  document.getElementById("cancelBtn").style.display = "inline-block";
  document.getElementById("tab-entry").textContent = "Edit case";
  switchTab("entry");
  window.scrollTo(0,0);
}

function cancelEdit() {
  editRowIndex = null;
  clearForm();
  document.getElementById("editBanner").style.display = "none";
  document.getElementById("saveBtn").textContent = "Save case";
  document.getElementById("cancelBtn").style.display = "none";
  document.getElementById("tab-entry").textContent = "New case";
}

async function deleteEntry(rowJson) {
  const entry = JSON.parse(rowJson);
  if (!confirm("Delete this case?")) return;
  const meta = await apiRequest("GET","?fields=sheets.properties");
  const sheetId = meta.sheets[0].properties.sheetId;
  await apiRequest("POST",":batchUpdate",{
    requests:[{deleteDimension:{range:{sheetId,dimension:"ROWS",startIndex:entry._row-1,endIndex:entry._row}}}]
  });
  await loadEntries();
}

function renderLog(query) {
  const list = document.getElementById("logList");
  const q = (query||"").toLowerCase();
  const filtered = q ? allEntries.filter(e => Object.values(e).join(" ").toLowerCase().includes(q)) : allEntries;
  if (filtered.length === 0) { list.innerHTML = '<p class="text-gray-400 text-sm py-8 text-center">No cases logged yet.</p>'; return; }
  list.innerHTML = filtered.slice().reverse().map(entry => {
    const safe = JSON.stringify(entry).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    return `<div class="bg-white border border-gray-200 rounded-xl p-4 mb-3 shadow-sm">
      <div class="flex justify-between items-start gap-2">
        <div class="flex-1 min-w-0">
          <div class="font-medium text-sm text-gray-900 overflow-hidden text-ellipsis whitespace-nowrap">${entry.Operation}</div>
          <div class="text-xs text-gray-400 mt-0.5">${entry.DateOfOperation} &middot; ${entry.Hospital} &middot; ${entry.Supervision} &middot; ASA ${entry.ASA} &middot; ${entry.CEPOD}${entry.ResponsibleConsultant ? " &middot; "+entry.ResponsibleConsultant : ""}</div>
          ${entry.OperationNotes ? '<div class="text-xs text-gray-500 mt-1 overflow-hidden text-ellipsis whitespace-nowrap">'+entry.OperationNotes+'</div>' : ""}
        </div>
        <div class="flex gap-1 shrink-0">
          <button class="px-3 py-2 text-xs rounded-lg border border-gray-300 bg-transparent cursor-pointer text-gray-700 hover:bg-gray-100 transition-colors min-h-[44px]" onclick="editEntry('${safe}')">Edit</button>
          <button class="px-3 py-2 text-xs rounded-lg border border-red-200 bg-transparent cursor-pointer text-red-600 hover:bg-red-50 transition-colors min-h-[44px]" onclick="deleteEntry('${safe}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function exportCSV() {
  const toExport = lastExportTime
    ? allEntries.filter(e => new Date(e.DateOfOperation) >= new Date(lastExportTime))
    : allEntries;
  if (toExport.length === 0) { alert("No new entries to export."); return; }
  const rows = [COLS.join(","), ...toExport.map(e =>
    COLS.map(c => { const v = String(e[c]||""); return v.includes(",")||v.includes('"')||v.includes("\n") ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(",")
  )].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows],{type:"text/csv"}));
  a.download = "logbook_export_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  lastExportTime = new Date().toISOString();
  localStorage.setItem("logbook_last_export", lastExportTime);
}

function switchTab(t) {
  document.getElementById("view-entry").style.display = t==="entry" ? "block" : "none";
  document.getElementById("view-log").style.display = t==="log" ? "block" : "none";
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  if (t==="log") renderLog("");
}

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.innerHTML = msg;
  el.className = "status" + (type==="error" ? " error" : "");
}

function onOpInput(v) {
  sugFiltered = v.length > 0 ? PROCEDURES.filter(p => p.toLowerCase().includes(v.toLowerCase())).slice(0,8) : [];
  activeIdx = -1;
  const box = document.getElementById("suggestions");
  if (sugFiltered.length === 0) { box.style.display="none"; return; }
  box.innerHTML = sugFiltered.map((p,i) => '<div class="suggest-item px-3 py-2 text-sm cursor-pointer" onmousedown="selectOp(this.dataset.val)" data-val="'+p.replace(/"/g,'&quot;')+'">'+p+'</div>').join("");
  box.style.display = "block";
}

function onOpKey(e) {
  if (sugFiltered.length === 0) return;
  if (e.key==="ArrowDown") { e.preventDefault(); activeIdx=Math.min(activeIdx+1,sugFiltered.length-1); highlightSug(); }
  else if (e.key==="ArrowUp") { e.preventDefault(); activeIdx=Math.max(activeIdx-1,0); highlightSug(); }
  else if (e.key==="Enter" && activeIdx>=0) { e.preventDefault(); selectOp(sugFiltered[activeIdx]); }
  else if (e.key==="Escape") hideSug();
}

function highlightSug() {
  document.querySelectorAll(".suggest-item").forEach((el,i) => el.classList.toggle("active",i===activeIdx));
}

function selectOp(p) { document.getElementById("f-Operation").value = p; hideSug(); }
function hideSug() { document.getElementById("suggestions").style.display = "none"; }
</script>
</body>
</html>
